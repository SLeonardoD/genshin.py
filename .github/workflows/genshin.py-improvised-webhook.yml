name: Inprovised Webhook

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

permissions:
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check upstream master
        env:
          UPSTREAM_REPO: "seriaati/genshin.py"
          API_URL: "https://TU-API-AQUI.example.com/webhook"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_REPO: ${{ github.repository }}
        run: |

          echo "Checking $UPSTREAM_REPO master..."

          # Obtener SHA actual de master
          CURRENT_SHA=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$UPSTREAM_REPO/commits/master" \
            | jq -r '.sha')

          echo "Current upstream SHA: $CURRENT_SHA"

          # Comprobar que obtuvimos un SHA válido
          if [ -z "$CURRENT_SHA" ] || [ "$CURRENT_SHA" = "null" ]; then
            echo "ERROR: Could not obtain upstream SHA."
            exit 1
          fi

          # Obtener la variable LAST_UPSTREAM_SHA
          RESPONSE=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$CURRENT_REPO/actions/variables/LAST_UPSTREAM_SHA" \
            2>/dev/null || true)

          LAST_SHA=$(echo "$RESPONSE" | jq -r '.value // empty')

          echo "Last known SHA: $LAST_SHA"

          # Primera ejecución
          if [ -z "$LAST_SHA" ]; then

            echo "First run."
            echo "Creating LAST_UPSTREAM_SHA..."

            curl -fsSL \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$CURRENT_REPO/actions/variables" \
              -d "{
                \"name\": \"LAST_UPSTREAM_SHA\",
                \"value\": \"$CURRENT_SHA\"
              }"

            echo "Initial SHA saved."
            exit 0
          fi

          # No hay cambios
          if [ "$CURRENT_SHA" = "$LAST_SHA" ]; then
            echo "No changes detected."
            exit 0
          fi

          # Hay cambios
          echo "================================="
          echo "CHANGE DETECTED!"
          echo "Previous: $LAST_SHA"
          echo "Current:  $CURRENT_SHA"
          echo "================================="

          # Avisar a nuestra API
          curl -fsSL \
            -X POST \
            -H "Content-Type: application/json" \
            -d "{
              \"repository\": \"$UPSTREAM_REPO\",
              \"branch\": \"master\",
              \"previous_sha\": \"$LAST_SHA\",
              \"current_sha\": \"$CURRENT_SHA\"
            }" \
            "$API_URL"

          echo "API notification sent."

          # Actualizar variable
          curl -fsSL \
            -X PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$CURRENT_REPO/actions/variables/LAST_UPSTREAM_SHA" \
            -d "{
              \"value\": \"$CURRENT_SHA\"
            }"

          echo "SHA updated successfully."
