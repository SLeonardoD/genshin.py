name: Inprovised Webhook

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check upstream master
        env:
          UPSTREAM_REPO: "OWNER/REPOSITORY"
          API_URL: "https://TU-API-AQUI.example.com/webhook"
        run: |
          # Obtener el SHA actual de master del repositorio original
          CURRENT_SHA=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$UPSTREAM_REPO/commits/master" \
            | jq -r '.sha')

          echo "Upstream master: $CURRENT_SHA"

          # Si no pudimos obtener el SHA, detener el workflow
          if [ -z "$CURRENT_SHA" ] || [ "$CURRENT_SHA" = "null" ]; then
            echo "Could not obtain upstream SHA."
            exit 1
          fi

          # Leer el último SHA conocido
          if [ -f ".upstream-sha" ]; then
            LAST_SHA=$(cat .upstream-sha)
          else
            LAST_SHA=""
          fi

          echo "Last known SHA: $LAST_SHA"

          # Primera ejecución
          if [ -z "$LAST_SHA" ]; then
            echo "First run. Saving current SHA."

            echo "$CURRENT_SHA" > .upstream-sha

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add .upstream-sha
            git commit -m "chore: initialize upstream SHA"
            git push

            exit 0
          fi

          # No hay cambios
          if [ "$CURRENT_SHA" = "$LAST_SHA" ]; then
            echo "No changes."
            exit 0
          fi

          # Hay un cambio
          echo "CHANGE DETECTED!"
          echo "$LAST_SHA -> $CURRENT_SHA"

          # Avisar a nuestra API
          curl -fsSL \
            -X POST \
            -H "Content-Type: application/json" \
            -d "{
              \"repository\": \"$UPSTREAM_REPO\",
              \"branch\": \"master\",
              \"previous_sha\": \"$LAST_SHA\",
              \"current_sha\": \"$CURRENT_SHA\"
            }" \
            "$API_URL"

          # Guardar el nuevo SHA
          echo "$CURRENT_SHA" > .upstream-sha

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .upstream-sha
          git commit -m "chore: update upstream SHA"
          git push
